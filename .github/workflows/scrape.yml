name: Daily Scrape

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MISSING_RAM_TRIGGER_THRESHOLD: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture baseline metrics
        run: python3 scraper/verify_data.py --json > before-metrics.json

      - name: Run daily scrape
        run: ./run_scraper.sh

      - name: Capture latest scrape metrics
        if: success()
        run: python3 scraper/verify_data.py --json > after-metrics.json

      - name: Summarize metric delta
        if: success()
        run: |
          python3 scripts/metrics_gate.py \
            before-metrics.json \
            after-metrics.json \
            --markdown-out metrics-summary.md

      - name: Extract latest metrics
        id: latest_metrics
        if: success()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metrics = json.loads(Path("after-metrics.json").read_text(encoding="utf-8"))
          threshold = int(os.environ["MISSING_RAM_TRIGGER_THRESHOLD"])
          missing_ram = int(metrics["missing_ram"])

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"total_products={metrics['total_products']}\n")
              handle.write(f"missing_ram={missing_ram}\n")
              handle.write(f"missing_ssd={metrics['missing_ssd']}\n")
              handle.write(f"implausible_ram={metrics['implausible_ram']}\n")
              handle.write(f"missing_ram_high={'true' if missing_ram > threshold else 'false'}\n")
          PY

      - name: Upload scrape artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scrape-${{ github.run_id }}
          path: |
            before-metrics.json
            after-metrics.json
            metrics-summary.md
            index.html
          if-no-files-found: ignore

      - name: Commit updated index
        if: success()
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Daily data update"
          git push

      - name: Close open parser repair issue
        if: success() && steps.latest_metrics.outputs.missing_ram_high != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = 'Daily scrape parser repair';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const issue = issues.find((item) => item.title === title);
            if (!issue) {
              core.info('No open parser repair issue to close.');
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: 'Latest scheduled scrape no longer exceeds the missing-RAM threshold. Closing this parser repair issue.',
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: 'closed',
            });

      - name: Dispatch parser repair workflow
        if: success() && steps.latest_metrics.outputs.missing_ram_high == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'parser-fix.yml',
              ref: context.ref.replace('refs/heads/', ''),
              inputs: {
                source_run_id: String(context.runId),
                source_run_url: runUrl,
                total_products: '${{ steps.latest_metrics.outputs.total_products }}',
                missing_ram: '${{ steps.latest_metrics.outputs.missing_ram }}',
                missing_ssd: '${{ steps.latest_metrics.outputs.missing_ssd }}',
                implausible_ram: '${{ steps.latest_metrics.outputs.implausible_ram }}',
              },
            });
            core.info('Dispatched parser-fix workflow.');
